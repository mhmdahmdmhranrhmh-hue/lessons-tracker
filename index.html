<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#231942">
<title>حصصي</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <h1 id="title">حصصي</h1>
    <p id="today"></p>
  </div>
  <button id="bell" class="icon" aria-label="تفعيل الإشعارات">🔔</button>
</header>

<div id="alerts"></div>

<main>
  <section id="tab-sessions" class="tab"></section>
  <section id="tab-subjects" class="tab" hidden></section>
  <section id="tab-settings" class="tab" hidden></section>
</main>

<nav class="bar">
  <button data-tab="sessions" class="on">الحصص</button>
  <button data-tab="subjects">المواد والدفع</button>
  <button data-tab="settings">النسخ الاحتياطي</button>
</nav>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle">مادة جديدة</h2>
    <label>اسم المادة<input name="name" required></label>
    <fieldset>
      <legend>أيام الحصة</legend>
      <div id="dayPick"></div>
    </fieldset>
    <div class="row">
      <label>الساعة<input name="time" type="time" required></label>
      <label>أول حصة<input name="start" type="date" required></label>
    </div>
    <div class="row">
      <label>سعر الدرس (ج)<input name="price" type="number" min="0" inputmode="numeric"></label>
      <label>حصص الشهر<input name="cycle" type="number" min="1" value="8" inputmode="numeric"></label>
    </div>
    <label>نظام الحصة
      <select name="type"><option value="double">دبل (حصتين في يوم)</option><option value="single">عادي / فردي</option></select>
    </label>
    <div class="row">
      <button type="button" class="ghost" id="cancelDlg">إلغاء</button>
      <button type="submit" class="primary">حفظ</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
